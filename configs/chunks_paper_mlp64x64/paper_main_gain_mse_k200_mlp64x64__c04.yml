# MLP [64, 64] FOR THE PAPER'S MAIN SIMULATED SAMPLE-GAIN FIGURE ON MSE (2026-10-22, CE: Ridge, GB, ExtraTrees and
# MLP [64, 64]). Same design as configs/paper_main_gain_mse_k200.yml (job 1426287, whose Ridge / GB / ExtraTrees
# runs are reused); only the MLP architecture changes ([32] -> [64, 64], MSE gain ~10.8 vs ~6.8 at K = 20).
objective:
  - Regression:
      n_splits: [200]
      procedure: ["ShuffleSplit"]
      train_size: [1000]
      test_size: [0.2]
      fixed_split: [False]

dataset:
  - sim_linear:
      n_samples: [150000]
      n_features: [5]
      noise: [0.0]
      seed: [400, 401, 402, 403, 404, 405, 406, 407, 408, 409, 410, 411, 412, 413, 414, 415, 416, 417, 418, 419, 420, 421, 422, 423, 424, 425, 426, 427, 428, 429, 430, 431, 432, 433, 434, 435, 436, 437, 438, 439, 440, 441, 442, 443, 444, 445, 446, 447, 448, 449, 450, 451, 452, 453, 454, 455, 456, 457, 458, 459, 460, 461, 462, 463, 464, 465, 466, 467, 468, 469, 470, 471, 472, 473, 474, 475, 476, 477, 478, 479, 480, 481, 482, 483, 484, 485, 486, 487, 488, 489, 490, 491, 492, 493, 494, 495, 496, 497, 498, 499]
      fixed: [False]

solver:
  - MLP:
      hidden_layer_sizes: [[64, 64]]
