# SMALL-BUDGET SWEEP WITH THE MAIN-TEXT LEARNERS (2026-10-30, CE: Figure M.1 with the learners of the main text).
# Same design as the July sweeps (configs/linear_1000_half{1,2}_K20_smalldata{,2}.yml: sim_linear d = 5, noise 0,
# K = 20, seeds 0-999, n_tr 5-100), whose Ridge and ExtraTrees runs are reused; adds MLP (64, 64) and RandomFeatures
# (random Fourier features, 50 components, gamma 0.1, Ridge alpha 1e-3).
objective:
  - Regression:
      n_splits: [20]
      procedure: ["ShuffleSplit"]
      train_size: [5, 10, 15, 20, 25, 30, 50, 100]
      test_size: [0.2]
      fixed_split: [False]

dataset:
  - sim_linear:
      n_samples: [150000]
      n_features: [5]
      noise: [0]
      seed: [400, 401, 402, 403, 404, 405, 406, 407, 408, 409, 410, 411, 412, 413, 414, 415, 416, 417, 418, 419, 420, 421, 422, 423, 424, 425, 426, 427, 428, 429, 430, 431, 432, 433, 434, 435, 436, 437, 438, 439, 440, 441, 442, 443, 444, 445, 446, 447, 448, 449]
      fixed: [False]

solver:
  - MLP:
      hidden_layer_sizes: [[64, 64]]
  - KernelApprox:
      kind: ["rff"]
      n_components: [50]
      gamma: [0.1]
      alpha: [0.001]
