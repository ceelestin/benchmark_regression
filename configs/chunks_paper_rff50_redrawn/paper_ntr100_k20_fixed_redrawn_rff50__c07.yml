# RANDOM FOURIER FEATURES (50) AT n_tr = 100 ON A FROZEN SPLIT WITH THE DATA REDRAWN AT EVERY SEED (2026-10-30, CE: switch
# Figure J.1 to frozen-split runs whose data are redrawn, as the July runs benchopt_run_2026-07-27_21h00m32 used for
# Ridge / GB / ExtraTrees / MLP [32]). Identical to configs/paper_ntr100_k20_fixed_rff50.yml except dataset fixed = False.
objective:
  - Regression:
      n_splits: [20]
      procedure: ["ShuffleSplit"]
      train_size: [100]
      test_size: [0.2]
      fixed_split: [True]

dataset:
  - sim_linear:
      n_samples: [150000]
      n_features: [5]
      noise: [0]
      seed: [700, 701, 702, 703, 704, 705, 706, 707, 708, 709, 710, 711, 712, 713, 714, 715, 716, 717, 718, 719, 720, 721, 722, 723, 724, 725, 726, 727, 728, 729, 730, 731, 732, 733, 734, 735, 736, 737, 738, 739, 740, 741, 742, 743, 744, 745, 746, 747, 748, 749, 750, 751, 752, 753, 754, 755, 756, 757, 758, 759, 760, 761, 762, 763, 764, 765, 766, 767, 768, 769, 770, 771, 772, 773, 774, 775, 776, 777, 778, 779, 780, 781, 782, 783, 784, 785, 786, 787, 788, 789, 790, 791, 792, 793, 794, 795, 796, 797, 798, 799]
      fixed: [False]

solver:
  - KernelApprox:
      kind: ["rff"]
      n_components: [50]
      gamma: [0.1]
      alpha: [0.001]
