# RANDOM FOURIER FEATURES (50) AT n_tr = 100 ON A FROZEN SPLIT WITH THE DATA REDRAWN AT EVERY SEED (2026-10-30, CE: switch
# Figure J.1 to frozen-split runs whose data are redrawn, as the July runs benchopt_run_2026-07-27_21h00m32 used for
# Ridge / GB / ExtraTrees / MLP [32]). Identical to configs/paper_ntr100_k20_fixed_rff50.yml except dataset fixed = False.
objective:
  - Regression:
      n_splits: [20]
      procedure: ["ShuffleSplit"]
      train_size: [100]
      test_size: [0.2]
      fixed_split: [True]

dataset:
  - sim_linear:
      n_samples: [150000]
      n_features: [5]
      noise: [0]
      seed: [800, 801, 802, 803, 804, 805, 806, 807, 808, 809, 810, 811, 812, 813, 814, 815, 816, 817, 818, 819, 820, 821, 822, 823, 824, 825, 826, 827, 828, 829, 830, 831, 832, 833, 834, 835, 836, 837, 838, 839, 840, 841, 842, 843, 844, 845, 846, 847, 848, 849, 850, 851, 852, 853, 854, 855, 856, 857, 858, 859, 860, 861, 862, 863, 864, 865, 866, 867, 868, 869, 870, 871, 872, 873, 874, 875, 876, 877, 878, 879, 880, 881, 882, 883, 884, 885, 886, 887, 888, 889, 890, 891, 892, 893, 894, 895, 896, 897, 898, 899]
      fixed: [False]

solver:
  - KernelApprox:
      kind: ["rff"]
      n_components: [50]
      gamma: [0.1]
      alpha: [0.001]
