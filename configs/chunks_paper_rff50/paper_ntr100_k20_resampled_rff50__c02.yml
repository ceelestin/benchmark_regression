# RANDOM FOURIER FEATURES (50, gamma 0.1, Ridge alpha 1e-3) FOR THE PAPER'S SIMULATED GAIN FIGURES ON MSE (2026-10-22,
# CE: second high-gain learner beside MLP [64, 64], 50 features rather than 100). Same design as
# configs/paper_ntr100_k20_resampled_mlp64x64.yml, whose header follows:
# MLP [64, 64] FOR THE PAPER'S n_tr = 100 FIXED-vs-RESAMPLED-SPLIT GAIN FIGURE ON MSE (2026-10-22). Same design as the
# July runs benchopt_run_2026-07-27_21h01m05 (configs/linear_1000_K20_new_unfixed.yml, with
# dataset fixed = fixed_split = False as recorded in that parquet), whose Ridge / GB / ExtraTrees runs are reused.
objective:
  - Regression:
      n_splits: [20]
      procedure: ["ShuffleSplit"]
      train_size: [100]
      test_size: [0.2]
      fixed_split: [False]

dataset:
  - sim_linear:
      n_samples: [150000]
      n_features: [5]
      noise: [0]
      seed: [200, 201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 219, 220, 221, 222, 223, 224, 225, 226, 227, 228, 229, 230, 231, 232, 233, 234, 235, 236, 237, 238, 239, 240, 241, 242, 243, 244, 245, 246, 247, 248, 249, 250, 251, 252, 253, 254, 255, 256, 257, 258, 259, 260, 261, 262, 263, 264, 265, 266, 267, 268, 269, 270, 271, 272, 273, 274, 275, 276, 277, 278, 279, 280, 281, 282, 283, 284, 285, 286, 287, 288, 289, 290, 291, 292, 293, 294, 295, 296, 297, 298, 299]
      fixed: [False]

solver:
  - KernelApprox:
      kind: ["rff"]
      n_components: [50]
      gamma: [0.1]
      alpha: [0.001]
