# RANDOM FOURIER FEATURES (50, gamma 0.1, Ridge alpha 1e-3) FOR THE PAPER'S SIMULATED GAIN FIGURES ON MSE (2026-10-22,
# CE: second high-gain learner beside MLP [64, 64], 50 features rather than 100). Same design as
# configs/paper_ntr100_k20_fixed_mlp64x64.yml, whose header follows:
# MLP [64, 64] FOR THE PAPER'S n_tr = 100 FIXED-vs-RESAMPLED-SPLIT GAIN FIGURE ON MSE (2026-10-22). Same design as the
# July runs benchopt_run_2026-07-27_20h48m32 (configs/linear_1000_K20_new_fixed.yml, with
# dataset fixed = fixed_split = True as recorded in that parquet), whose Ridge / GB / ExtraTrees runs are reused.
objective:
  - Regression:
      n_splits: [20]
      procedure: ["ShuffleSplit"]
      train_size: [100]
      test_size: [0.2]
      fixed_split: [True]

dataset:
  - sim_linear:
      n_samples: [150000]
      n_features: [5]
      noise: [0]
      seed: [800, 801, 802, 803, 804, 805, 806, 807, 808, 809, 810, 811, 812, 813, 814, 815, 816, 817, 818, 819, 820, 821, 822, 823, 824, 825, 826, 827, 828, 829, 830, 831, 832, 833, 834, 835, 836, 837, 838, 839, 840, 841, 842, 843, 844, 845, 846, 847, 848, 849, 850, 851, 852, 853, 854, 855, 856, 857, 858, 859, 860, 861, 862, 863, 864, 865, 866, 867, 868, 869, 870, 871, 872, 873, 874, 875, 876, 877, 878, 879, 880, 881, 882, 883, 884, 885, 886, 887, 888, 889, 890, 891, 892, 893, 894, 895, 896, 897, 898, 899]
      fixed: [True]

solver:
  - KernelApprox:
      kind: ["rff"]
      n_components: [50]
      gamma: [0.1]
      alpha: [0.001]
