# PRE-REGISTERED HOLDOUT 3 (round 3, analysis/PREREGISTRATION_round3.md), written 2026-09-24
# BEFORE launch; do not edit. Regression family sim_nonlinear (MSE; statistic on squared error).
# Large-gain design v2: real unstable learners at train sizes 1000/3000/10000 where holdout 2
# found G_20 >= 10 (single trees, 2- and 5-tree ensembles); one stable control. NEW seeds 5000-5049.
# K = 200 ShuffleSplit, test_size 0.2. One file per family.

objective:
  - Regression:
      n_splits: [200]
      procedure: ["ShuffleSplit"]
      train_size: [1000, 3000, 10000]
      test_size: [0.2]
      fixed_split: [False]

dataset:
  - sim_nonlinear:
      n_samples: [150000]
      n_features: [20]
      noise: [0.3, 1.0]
      seed: [5030, 5031, 5032, 5033, 5034]
      fixed: [False]

solver:
  - Ridge:
      alpha: [1.0]
  - DecisionTree:
      max_depth: [20]
  - ExtraTrees_noHPO:
      n_estimators: [2, 5]
  - RandomForest:
      n_estimators: [2, 5]
      max_depth: [100]
